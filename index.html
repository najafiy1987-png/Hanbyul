<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معرفی برند هان‌بیول</title>
<style>
  :root {
    --bg: #F1E9DD; --surface: #FFFFFF; --text: #3D2E22; --text-muted: #7C6A58;
    --accent: #3D4A38; --accent-light: #A9B79C; --border: #E3D8C8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1B17; --surface: #2A2520; --text: #F1E9DD; --text-muted: #B8AA98;
      --accent: #A9B79C; --accent-light: #6B7A62; --border: #3D362D;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1B17; --surface: #2A2520; --text: #F1E9DD; --text-muted: #B8AA98;
    --accent: #A9B79C; --accent-light: #6B7A62; --border: #3D362D;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex; align-items: center; justify-content: center; min-height: 100%;
  }
  .card {
    max-width: 640px; width: 92%; margin: 24px auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--text-muted); font-size: 14px; text-align: center; margin: 0 0 20px; }
 .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
.video-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .status { margin-top: 16px; text-align: center; font-size: 14px; color: var(--text-muted); min-height: 20px; }
  .status.done { color: var(--accent); font-weight: 600; }
  button#continueBtn {
    display: block; width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: not-allowed; background: var(--border); color: var(--text-muted);
    transition: background 0.2s, color 0.2s;
  }
  button#continueBtn.enabled { background: var(--accent); color: var(--surface); cursor: pointer; }
  .note { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 10px; line-height: 1.6; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabBtn { flex: 1; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); font-size: 13px; cursor: pointer; }
  .tabBtn.active { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>معرفی برند «هان‌بیول» (HANBYUL)</h1>
  <p class="sub">لطفاً پیش از ادامه، ویدیوی زیر را تا پایان مشاهده کنید.</p>

  <div class="tabs">
    <button class="tabBtn active" id="tabAparat" onclick="switchProvider('aparat')">پخش از آپارات (پیشنهادی)</button>
    <button class="tabBtn" id="tabYoutube" onclick="switchProvider('youtube')">تماشا در یوتیوب (جایگزین)</button>
  </div>

  <div class="video-wrap" id="aparatWrap">
    <div id="93980432822"><script type="text/JavaScript" src="https://www.aparat.com/embed/wtk17gi?data[rnddiv]=93980432822&data[responsive]=yes"></script></div>
  </div>
  <div class="video-wrap" id="youtubeWrap" style="display:none;">
    <div id="player"></div>
  </div>

  <p class="status" id="status">در حال بارگذاری ویدیو...</p>
  <button id="continueBtn" disabled>ادامه به پرسشنامه</button>
  <p class="note">لطفاً ویدیو را با دقت و تا پایان تماشا کنید. پس از آن دکمه «ادامه» فعال می‌شود و می‌توانید به پرسشنامه بروید. از همکاری شما سپاسگزاریم.</p>
</div>

<script>
  // ===== تنظیمات =====
  const CONFIG = {
    aparatEmbedHash: "wtk17gi",
    aparatDurationSeconds: 13, // طول ویدیو (۱۰ ثانیه) + ۳ ثانیه اطمینان؛ اگر طول ویدیو عوض شد اصلاح کنید
    youtubeVideoId: "twlGeLG7nrQ",
    formLinks: {
      group1: "https://forms.gle/wD53hUuNjM9Ztspt7",
      group2: "https://forms.gle/cjE85hSrsE6uuBJFA",
      control: "https://forms.gle/W3DRiijS6EBT8ZHU9"
    }
  };
  // ================================================================

  function getGroup() {
    const hash = (location.hash || "").replace("#", "");
    if (["group1", "group2", "control"].includes(hash)) return hash;
    return null;
  }

  const group = getGroup();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('continueBtn');

  if (!group) {
    statusEl.textContent = "خطا: شناسه گروه در آدرس صفحه مشخص نیست (مثال صحیح: ...#group1)";
  }

  let provider = 'aparat';
  let ytPlayer = null;
  let ytReady = false;
  let aparatTimer = null;
  let aparatUnlocked = false;
  let youtubeUnlocked = false;

  function markUnlocked(msg) {
    statusEl.textContent = msg;
    statusEl.classList.add('done');
    btn.disabled = false;
    btn.classList.add('enabled');
  }
  function markLocked(msg) {
    statusEl.textContent = msg;
    statusEl.classList.remove('done');
    btn.disabled = true;
    btn.classList.remove('enabled');
  }

  // کد آپارات به‌صورت ثابت در HTML قرار دارد؛ اینجا فقط شمارش زمان را شروع می‌کنیم.
  let aparatTimerStarted = false;
  function startAparatTimer() {
    if (aparatTimerStarted) return;
    aparatTimerStarted = true;
    aparatTimer = setTimeout(() => {
      aparatUnlocked = true;
      if (provider === 'aparat') markUnlocked("✓ زمان مشاهده ویدیو سپری شد. اکنون می‌توانید ادامه دهید.");
    }, CONFIG.aparatDurationSeconds * 1000);
  }

  function loadAparat() {
    if (aparatUnlocked) { markUnlocked("✓ ویدیو مشاهده شد. اکنون می‌توانید ادامه دهید."); return; }
    markLocked("در حال مشاهده ویدیو (آپارات)... لطفاً تا پایان صبر کنید.");
    // شمارش را وقتی شروع کن که پلیر آپارات در صفحه ظاهر شد (حداکثر ۶ ثانیه صبر)
    const wrap = document.getElementById('aparatWrap');
    const begin = () => { observer.disconnect(); clearTimeout(fallback); startAparatTimer(); };
    const observer = new MutationObserver(() => { if (wrap.querySelector('iframe')) begin(); });
    observer.observe(wrap, { childList: true, subtree: true });
    const fallback = setTimeout(begin, 6000);
    if (wrap.querySelector('iframe')) begin();
  }

  function loadYoutubeApiOnce() {
    if (ytReady) return;
    ytReady = true;
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('player', {
        videoId: CONFIG.youtubeVideoId,
        playerVars: { rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { if (provider === 'youtube' && !youtubeUnlocked) markLocked("در حال مشاهده ویدیو (یوتیوب)..."); },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              youtubeUnlocked = true;
              if (provider === 'youtube') markUnlocked("✓ ویدیو مشاهده شد. اکنون می‌توانید ادامه دهید.");
            }
          }
        }
      });
    };
  }

  function switchProvider(p) {
    provider = p;
    document.getElementById('tabAparat').classList.toggle('active', p === 'aparat');
    document.getElementById('tabYoutube').classList.toggle('active', p === 'youtube');
    document.getElementById('aparatWrap').style.display = (p === 'aparat') ? 'block' : 'none';
    document.getElementById('youtubeWrap').style.display = (p === 'youtube') ? 'block' : 'none';
    if (p === 'aparat') {
      if (aparatUnlocked) markUnlocked("✓ ویدیو مشاهده شد. اکنون می‌توانید ادامه دهید.");
      else loadAparat();
    } else {
      loadYoutubeApiOnce();
      if (youtubeUnlocked) markUnlocked("✓ ویدیو مشاهده شد. اکنون می‌توانید ادامه دهید.");
      else markLocked("در حال بارگذاری یوتیوب...");
    }
  }

  if (group) loadAparat();
  else statusEl.textContent = "خطا: شناسه گروه در آدرس صفحه مشخص نیست (مثال صحیح: ...#group1)";

  btn.addEventListener('click', () => {
    if (btn.disabled || !group) return;
    try {
      localStorage.setItem('hanbyul_video_watched_' + group, '1');
    } catch (e) {}
    window.location.href = CONFIG.formLinks[group];
  });
</script>
</body>
</html>
